[project]
name = "origami-ad"
version = "0.1.0"
description = "Stage 1: YouTube coverage audit + FoldingAgent transfer on in-the-wild origami tutorials"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "huggingface_hub>=0.25",
    "numpy>=1.26",
    "pandas>=2.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scipy>=1.11",
    "networkx>=3.0",
    "shapely>=2.0",  # describe.py paper-state sentences
    "yt-dlp>=2024.1",
    "opencv-python-headless>=4.9",
    "mediapipe>=0.10",
    "anthropic>=1.0",  # keyframe_select
    "tqdm>=4.60",
    "tabulate>=0.9",
    # FoldingAgent + its engine, installed from the submodule / git pin
    "foldingagent",
    "foldingagent-simulator",
]

[project.optional-dependencies]
review = ["streamlit>=1.30"]
dev = ["ruff>=0.5", "pytest>=8"]

[tool.uv.sources]
foldingagent = { path = "external/FoldingAgent", editable = true }
foldingagent-simulator = { git = "https://github.com/maya-moriya/FoldingAgentSimulator.git", rev = "f6d4fc6aaf4dfa2c82a8b5f7274c198498f4f122" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/origami_ad"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
